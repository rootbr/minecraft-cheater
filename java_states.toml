# Java Edition Block State Constants and Mappings
# Direction mappings and block name conversions for GrabCraft to Java Edition

# =============================================================================
# DIRECTION MAPPINGS
# =============================================================================

# Java Edition uses string direction names directly

# https://minecraft.wiki/w/Stairs#Block_states
[stair_facing]
east = "east"
west = "west"
south = "south"
north = "north"

# https://minecraft.wiki/w/Bed#Block_states
[bed_facing]
south = "south"
west = "west"
north = "north"
east = "east"

# https://minecraft.wiki/w/Piston#Block_states
[sixway_facing]
down = "down"
up = "up"
south = "south"
north = "north"
east = "east"
west = "west"

# https://minecraft.wiki/w/Chest#Block_states
[horizontal_facing]
north = "north"
south = "south"
west = "west"
east = "east"

# https://minecraft.wiki/w/Door#Block_states
[door_facing]
east = "east"
south = "south"
west = "west"
north = "north"

# https://minecraft.wiki/w/Trapdoor#Block_states
[trapdoor_facing]
east = "east"
south = "south"
west = "west"
north = "north"

# https://minecraft.wiki/w/Vines#Block_states
# Java uses individual boolean states per face, not a bitmask
[vine_bits]
south = 1
west = 2
north = 4
east = 8

# https://minecraft.wiki/w/Torch#Block_states
# Java wall torches use "facing" = direction the torch points FROM the wall
# GrabCraft gives the direction the torch is attached TO, which is opposite
[torch_facing]
west = "east"
east = "west"
north = "south"
south = "north"
top = "up"

# https://minecraft.wiki/w/Log#Block_states
[pillar_axis]
y = "y"
x = "x"
z = "z"
"north/south" = "z"
"east/west" = "x"
"up/down" = "y"

# https://minecraft.wiki/w/Button#Block_states
# Java buttons use face (floor/wall/ceiling) + facing
[button_face]
down = "ceiling"
up = "floor"
north = "wall"
south = "wall"
west = "wall"
east = "wall"

[button_facing]
down = "north"
up = "north"
north = "north"
south = "south"
west = "west"
east = "east"

# Wall sign direction: maps 8-way compass to 4-way facing
[wall_sign_facing]
north = "north"
north-northeast = "north"
north-northwest = "north"
nnw = "north"
nne = "north"
south = "south"
south-southeast = "south"
south-southwest = "south"
ssw = "south"
sse = "south"
west = "west"
west-northwest = "west"
west-southwest = "west"
wnw = "west"
wsw = "west"
east = "east"
east-northeast = "east"
east-southeast = "east"
ene = "east"
ese = "east"

# =============================================================================
# HALF / POSITION MAPPINGS
