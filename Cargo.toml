[package]
name = "mc-commander"
version = "0.1.0"
edition = "2021"

[dependencies]
enigo = "0.2"
arboard = "3.4"
clap = { version = "4.5", features = ["derive"] }

# Screenshot capture (portable alternative)
scrap = "0.5"

# Image processing for pixel detection
image = "0.24"

# Configuration file support
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

# GUI framework
eframe = "0.31"
egui = "0.31"
